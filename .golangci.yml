# golangci-lint v2 configuration.
# Generated gqlgen code (graph/generated, graph/customTypes) carries the
# `// Code generated ... DO NOT EDIT.` header and is auto-excluded; the
# explicit path rules below also exclude it should the header ever change.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    generated: lax
    paths:
      - graph/generated
      - graph/customTypes

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - graph/generated
      - graph/customTypes
