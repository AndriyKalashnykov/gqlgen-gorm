name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RETAIN_DAYS: '7'
    steps:
      - name: Delete workflow runs older than RETAIN_DAYS
        run: |
          cutoff=$(date -u -d "${RETAIN_DAYS} days ago" +%s)
          deleted=0
          gh api --paginate "repos/${GH_REPO}/actions/runs" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at)"' \
          | while read -r id created; do
              ts=$(date -u -d "$created" +%s)
              if [ "$ts" -lt "$cutoff" ]; then
                gh api -X DELETE "repos/${GH_REPO}/actions/runs/${id}" \
                  && deleted=$((deleted + 1)) \
                  && echo "deleted run ${id} (${created})"
              fi
            done
          echo "cleanup complete"
